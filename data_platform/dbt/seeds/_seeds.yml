version: 2
seeds:
  - name: canonical_values
    description: >-
      Translations from source category values to canonical codes, generated by `bank-data codegen` from
      bank_data.contracts.canonical. Values outside the seed are canonicalized to lower snake case.
    columns:
      - name: domain
        data_tests: [not_null]
      - name: source_value
        data_tests: [not_null]
      - name: canonical
        data_tests: [not_null]
