# Personas that the committed bounded sample can support. The full organizer warehouse uses personas.yaml.
# These criteria were verified against the deterministic sample generated by `make data-sample`.
version: 1
seed: bank-demo-personas-v1
customers:
  - id: acc-mx-accounts
    criterion: checking_and_savings_with_balances
    country: MX
    workflows: [account_inquiry]
    demonstrates: Balances with their as-of instant on a checking and a savings account
  - id: crd-mx-two-cards
    criterion: two_active_cards
    country: MX
    workflows: [card_support]
    demonstrates: Two active cards
  - id: crd-co-declined
    criterion: card_with_declined_purchase
    country: CO
    workflows: [card_support]
    demonstrates: A declined card purchase
  - id: crd-ar-expired
    criterion: expired_card
    country: AR
    workflows: [card_support]
    demonstrates: An expired card
  - id: crd-mx-blocked
    criterion: blocked_card
    country: MX
    workflows: [card_support]
    demonstrates: An already blocked card
  - id: dsp-co-unrecognized
    criterion: card_with_recent_purchase
    country: CO
    workflows: [dispute, card_support]
    demonstrates: A recent approved card purchase to dispute as unrecognized
  - id: dsp-mx-open-case
    criterion: card_with_recent_purchase
    country: MX
    seeded_case: true
    workflows: [dispute]
    demonstrates: An open dispute case
  - id: cre-mx-complete
    criterion: complete_credit_profile
    country: MX
    workflows: [credit]
    demonstrates: A complete credit profile with no days past due
  - id: cre-co-no-income
    criterion: credit_profile_without_income
    country: CO
    workflows: [credit]
    demonstrates: No income on file
  - id: cre-ar-borderline
    criterion: borderline_credit_score
    country: AR
    workflows: [credit]
    demonstrates: A credit score near the synthetic threshold
  - id: cre-mx-past-due
    criterion: credit_days_past_due
    country: MX
    workflows: [credit]
    demonstrates: Days past due on a credit product
  - id: cre-co-application
    criterion: complete_credit_profile
    country: CO
    seeded_application: true
    workflows: [credit]
    demonstrates: An existing credit application intake
staff:
  - id: agent-demo-01
    staff_id: agent-demo-01
    role: agent
    display_name: Demo agent
  - id: evaluator-demo-01
    staff_id: evaluator-demo-01
    role: evaluator
    display_name: Demo evaluator
coverage:
  min_customers_per_country: 2
  every_segment: true
