[project]
name = "bank-data"
version = "0.1.0"
description = "Data platform: ingestion, contracts, transformations, and data reports."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "typer>=0.27.2,<1",
]

[project.scripts]
bank-data = "bank_data.cli:app"

[build-system]
requires = ["uv_build>=0.11.17,<0.13"]
build-backend = "uv_build"
