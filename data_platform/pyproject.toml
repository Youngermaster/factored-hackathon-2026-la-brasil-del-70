[project]
name = "bank-data"
version = "0.1.0"
description = "Data platform: ingestion, contracts, transformations, and data reports."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3>=1.43,<2",
  "dbt-core>=1.11,<1.13",
  "dbt-duckdb>=1.11.0,<2",
  "duckdb>=1.5.5,<2",
  "pandera[pandas]>=0.33.1,<1",
  "pydantic>=2.13.5,<3",
  "pydantic-settings>=2.15.0,<3",
  "pyyaml>=6.0.3,<7",
  "typer>=0.27.2,<1",
]

[project.scripts]
bank-data = "bank_data.cli:app"

[build-system]
requires = ["uv_build>=0.11.17,<0.13"]
build-backend = "uv_build"
