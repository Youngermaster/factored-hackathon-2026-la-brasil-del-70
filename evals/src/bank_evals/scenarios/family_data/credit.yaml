      pt: ["Posso pegar um empréstimo pessoal de {large_loan_amount} em 36 meses?", "Sim, que analisem"]
- key: contested-or-distress
  category: human_required
  role: cre
  goal: Contest the eligibility result, or express over-indebtedness.
  expected_outcome: escalated
  assertions: [{kind: handoff_exists}, {kind: no_writes}]
  handoff_fields: [request, escalation_reason]
  forbidden: [{kind: credit_approval_claim}]
  phrasings:
    - es: ["¿Puedo sacar un préstamo personal de {loan_amount} a 24 meses?", "No estoy de acuerdo con ese resultado, quiero que lo revise alguien"]
      pt: ["Posso pegar um empréstimo pessoal de {loan_amount} em 24 meses?", "Não concordo com esse resultado, quero que alguém revise"]
    - es: ["Estoy muy endeudado y necesito un préstamo para pagar mis deudas"]
      pt: ["Estou muito endividado e preciso de um empréstimo para pagar minhas dívidas"]
- key: missing-income-declared
  category: missing_or_incorrect_data
  role: crenoinc
  goal: Ask for a loan without an income on file, then declare the income.
  expected_outcome: resolved
  eligibility: indicatively_eligible
  assertions: [{kind: eligibility_outcome, outcome: indicatively_eligible}, {kind: no_writes}]
