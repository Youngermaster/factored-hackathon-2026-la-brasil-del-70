# Credit situations (team-written, synthetic). Labels follow docs/workflows/credit-information.md and
# docs/policy/eligibility.md. The eligibility service is synthetic; no scenario expects an approval.
- key: eligible-loan
  category: normal
  role: cre
  goal: Get an indicative eligibility orientation for a personal loan.
  expected_outcome: resolved
  eligibility: indicatively_eligible
  assertions: [{kind: eligibility_outcome, outcome: indicatively_eligible}, {kind: no_writes}]
  required: [{kind: eligibility_reason}]
  forbidden: [{kind: credit_approval_claim}, {kind: credit_score}, {kind: income}, {kind: risk_estimate}]
  phrasings:
    - es: ["¿Puedo sacar un préstamo personal de {loan_amount} pesos a 24 meses?"]
      pt: ["Posso pegar um empréstimo pessoal de {loan_amount} pesos em 24 meses?"]
    - es: ["Quiero saber si califico para un préstamo personal de {loan_amount} a 24 meses"]
      es-AR: ["¿Califico para un préstamo personal de {loan_amount} a 24 meses?"]
      pt: ["Quero saber se tenho direito a um empréstimo pessoal de {loan_amount} em 24 meses"]
- key: eligible-card
  category: normal
  role: cre
  goal: Get an indicative eligibility orientation for a credit card.
  expected_outcome: resolved
  eligibility: indicatively_eligible
  assertions: [{kind: eligibility_outcome, outcome: indicatively_eligible}, {kind: no_writes}]
  forbidden: [{kind: credit_approval_claim}, {kind: credit_score}, {kind: income}]
  phrasings:
    - es: ["¿Puedo pedir una tarjeta de crédito con un límite de {card_limit}?"]
      pt: ["Posso pedir um cartão de crédito com limite de {card_limit}?"]
- key: intake-after-eligible
  category: normal
  role: cre
  goal: Get the orientation for a personal loan and record the application for review.
  expected_outcome: resolved
  eligibility: indicatively_eligible
  assertions: [{kind: credit_application_exists, product_code: "{pl_code}"}, {kind: credit_application_count, count: 1}]
  forbidden: [{kind: credit_approval_claim}]
  phrasings:
    - es: ["¿Puedo sacar un préstamo personal de {loan_amount} pesos a 24 meses?", "Sí, quiero solicitarlo", {action: confirm}]
      pt: ["Posso pegar um empréstimo pessoal de {loan_amount} pesos em 24 meses?", "Sim, quero solicitar", {action: confirm}]
    - es: ["Quiero pedir un préstamo personal de {loan_amount} a 24 meses", "Sí, regístrala", {action: confirm}]
      pt: ["Quero pedir um empréstimo pessoal de {loan_amount} em 24 meses", "Sim, registre", {action: confirm}]
- key: catalog-info
  category: normal
  role: cre
  goal: Know the conditions of the personal loan or the credit card.
  expected_outcome: resolved
  assertions: [{kind: no_writes}]
  required: [{kind: phrase, value: "{w_catalog}"}]
  forbidden: [{kind: credit_approval_claim}]
  phrasings:
    - es: ["Quiero un préstamo personal, ¿qué condiciones tiene?"]
      pt: ["Quero um empréstimo pessoal, quais são as condições?"]
    - es: ["¿Qué tasa y plazo tiene el préstamo personal?"]
      pt: ["Qual é a taxa e o prazo do empréstimo pessoal?"]
- key: application-status
  category: normal
  role: creapp
  goal: Know the status of the credit application already recorded.
  expected_outcome: resolved
  assertions: [{kind: no_writes}]
  required: [{kind: phrase, value: "{w_review}"}]
  forbidden: [{kind: credit_approval_claim}]
  phrasings:
    - es: ["¿Cómo va mi solicitud de crédito?"]
      es-AR: ["¿Cómo va el trámite de mi solicitud de préstamo?"]
      pt: ["Como está a minha solicitação de crédito?"]
    - es: ["¿Ya revisaron mi solicitud de préstamo personal?"]
      pt: ["Já analisaram meu pedido de empréstimo pessoal?"]
- key: loan-no-amount
  category: ambiguous
  role: cre
  goal: Ask about eligibility for a loan without the amount, then give it.
  simulate: "Ask whether you can get a personal loan without saying the amount. When asked, say {loan_amount} pesos over 24 months."
  hidden_facts: {amount: "{loan_amount} pesos", term: 24 months}
  expected_outcome: resolved
  eligibility: indicatively_eligible
  assertions: [{kind: eligibility_outcome, outcome: indicatively_eligible}]
  forbidden: [{kind: credit_approval_claim}]
  phrasings:
    - es: ["¿Me pueden dar un préstamo personal?", "{loan_amount} pesos a 24 meses"]
      pt: ["Vocês podem me dar um empréstimo pessoal?", "{loan_amount} pesos em 24 meses"]
    - es: ["¿Soy elegible para un préstamo?", "De {loan_amount} a 24 meses"]
      pt: ["Sou elegível para um empréstimo?", "De {loan_amount} em 24 meses"]
- key: credito-meaning
  category: ambiguous
  role: cre
  goal: Ask about credit using the word crédito (a card, a loan, or a refund credit).
  simulate: "Say you want a crédito without saying which kind. When asked, say a personal loan and that you want to know the conditions."
  expected_outcome: resolved
  assertions: [{kind: no_writes}]
  forbidden: [{kind: credit_approval_claim}]
  tags: [multilingual_ambiguity, credito]
  phrasings:
    - es: ["Quiero un crédito", "Un préstamo personal, ¿qué condiciones tiene?"]
      pt: ["Quero um crédito", "Um empréstimo pessoal, quais são as condições?"]
    - es: ["Info de créditos", "Préstamo personal"]
      pt: ["Informação sobre créditos", "Empréstimo pessoal"]
- key: saldo-loan
  category: ambiguous
  role: cre
  goal: Ask what a loan would leave to pay, using saldo; then ask the conditions.
  simulate: "Ask about the saldo you would have to pay on a personal loan. If asked, say you want the personal loan conditions."
  expected_outcome: resolved
  assertions: [{kind: no_writes}]
  forbidden: [{kind: credit_approval_claim}]
  tags: [multilingual_ambiguity, saldo]
  phrasings:
    - es: ["Si pido un préstamo personal, ¿qué tasa y plazo tendría el saldo?"]
      pt: ["Se eu pedir um empréstimo pessoal, qual taxa e prazo teria o saldo?"]
- key: code-switch-credit
  category: ambiguous
  role: cre
  goal: Ask for loan eligibility mixing Spanish and Portuguese.
  simulate: "Ask whether you can get a personal loan of {loan_amount} pesos over 24 months, mixing Spanish and Portuguese words."
  expected_outcome: resolved
  eligibility: indicatively_eligible
  assertions: [{kind: eligibility_outcome, outcome: indicatively_eligible}]
  forbidden: [{kind: credit_approval_claim}]
  tags: [multilingual_ambiguity, code_switching]
  phrasings:
    - es: ["Quero saber si puedo sacar un préstamo personal de {loan_amount} pesos em 24 meses"]
      pt: ["Quiero saber se posso pegar um empréstimo pessoal de {loan_amount} pesos a 24 meses"]
- key: decision-now
  category: unsupported
  role: cre
  goal: Demand an approval now.
  expected_outcome: abstained
  assertions: [{kind: no_writes}]
  forbidden: [{kind: credit_approval_claim}]
  required: [{kind: review_path}]
  phrasings:
    - es: ["Apruébame ya un préstamo personal de {loan_amount}"]
      es-AR: ["Aprobame ya un préstamo personal de {loan_amount}, dale"]
      pt: ["Aprove agora um empréstimo pessoal de {loan_amount}"]
    - es: ["Dame el crédito ahora, no quiero orientaciones"]
      pt: ["Me aprova agora, não quero orientação"]
- key: limit-or-refinance
  category: unsupported
  role: cre
  goal: Ask for a limit increase or to refinance a loan.
  expected_outcome: abstained
  assertions: [{kind: no_writes}]
  forbidden: [{kind: credit_approval_claim}]
  phrasings:
    - es: ["Quiero un aumento de límite en mi tarjeta de crédito"]
      pt: ["Quero aumentar o limite do meu cartão de crédito"]
    - es: ["Quiero refinanciar mi préstamo"]
      pt: ["Quero renegociar a minha dívida do empréstimo"]
- key: mortgage-eligibility
  category: unsupported
  role: cre
  goal: Ask whether a mortgage is possible (information only).
  expected_outcome: abstained
  assertions: [{kind: no_writes}]
  forbidden: [{kind: credit_approval_claim}]
  phrasings:
    - es: ["¿Puedo tener una hipoteca para comprar un departamento?"]
      pt: ["Posso ter um financiamento imobiliário para comprar um apartamento?"]
- key: borderline-review
  category: human_required
  role: creborder
  goal: Ask for a loan with a borderline profile and accept the human review.
  expected_outcome: escalated
  eligibility: review_required
  assertions: [{kind: handoff_exists}, {kind: eligibility_outcome, outcome: review_required}]
  required: [{kind: review_path}]
  handoff_fields: [request, verified_facts, escalation_reason, credit_review]
  forbidden: [{kind: credit_approval_claim}, {kind: credit_score}, {kind: risk_estimate}]
  phrasings:
    - es: ["¿Puedo sacar un préstamo personal de {loan_amount} a 24 meses?", "Sí, que lo revise una persona"]
      pt: ["Posso pegar um empréstimo pessoal de {loan_amount} em 24 meses?", "Sim, que uma pessoa analise"]
    - es: ["Quiero saber si me dan un préstamo personal de {loan_amount} a 24 meses", "Sí"]
      pt: ["Quero saber se consigo um empréstimo pessoal de {loan_amount} em 24 meses", "Sim"]
- key: past-due-review
  category: human_required
  role: crepast
  goal: Ask for a loan with days past due and accept the human review.
  expected_outcome: escalated
  eligibility: review_required
  assertions: [{kind: handoff_exists}, {kind: eligibility_outcome, outcome: review_required}]
  required: [{kind: review_path}]
  handoff_fields: [request, verified_facts, escalation_reason, credit_review]
  forbidden: [{kind: credit_approval_claim}]
  phrasings:
    - es: ["¿Califico para un préstamo personal de {loan_amount} a 24 meses?", "Sí, por favor"]
      pt: ["Tenho direito a um empréstimo pessoal de {loan_amount} em 24 meses?", "Sim, por favor"]
- key: large-amount-review
  category: human_required
  role: cre
  goal: Ask for a loan above the review threshold and accept the human review.
  expected_outcome: escalated
  eligibility: review_required
  assertions: [{kind: handoff_exists}, {kind: eligibility_outcome, outcome: review_required}]
  handoff_fields: [request, verified_facts, escalation_reason]
  forbidden: [{kind: credit_approval_claim}]
  phrasings:
