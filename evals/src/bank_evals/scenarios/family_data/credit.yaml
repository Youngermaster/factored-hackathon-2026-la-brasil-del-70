      pt: ["Vocês me dão um cartão de crédito com limite de {card_limit}?", "Sim, prefiro que uma pessoa analise"]
- key: expired-intake
  category: expired_session
  role: cre
  goal: Record a loan application when the session expires before the confirmation.
  expected_outcome: resolved
