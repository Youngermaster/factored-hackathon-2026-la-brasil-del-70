# Sentences for the customer-facing eligibility explanation (English, for the console). Synthetic demonstration content.
# No approval wording, even negated: the lexicon test checks every value.
heading:
  synthetic_notice: "Synthetic eligibility guide (demonstration): this is not a credit decision."
  reasons: "Reasons, with the rule behind each one:"
  missing: "Missing information:"
outcome:
  indicatively_eligible: "Under the synthetic rules, your profile indicatively meets this product's conditions."
  not_eligible: "Under the synthetic rules, your profile does not meet this product's indicative conditions for now."
  review_required: "Your case needs a review by a person from the credit team."
  insufficient_data: "We are missing information needed to give you a guide."
reason:
  self_service_product: "The product supports an automatic guide."
  product_requires_human_assessment: "This product needs an assessment by a person from the team."
  credit_score_present: "A credit score is on record."
  missing_credit_score: "No credit score is on record."
  credit_score_meets_minimum: "The credit score reaches the product's minimum."
  credit_score_below_minimum: "The credit score is below the product's minimum."
  income_present: "A monthly income is available."
  missing_income: "No monthly income is available."
  income_currency_mismatch: "The available income is in another currency and cannot be compared."
  payment_to_income_within_maximum: "The estimated monthly payment is within the maximum relative to your income."
  payment_to_income_above_maximum: "The estimated monthly payment exceeds the maximum relative to your income."
  days_past_due_within_maximum: "There are no arrears on your credit products."
  missing_days_past_due: "There is no information about arrears on your credit products."
  days_past_due_present: "There are arrears on your credit products."
  tenure_meets_minimum: "Your time as a customer reaches the minimum."
  missing_tenure: "There is no information about your time as a customer."
  tenure_below_minimum: "Your time as a customer is below the minimum."
  amount_within_product_range: "The amount and term are within the product's range."
  amount_outside_product_range: "The amount is outside the product's range."
  term_outside_product_range: "The term is outside the product's range."
  purpose_not_offered: "The product does not accept that purpose."
  amount_above_review_threshold: "The amount is above the human review threshold."
  risk_estimate_available: "A risk estimate is available."
  risk_estimate_unavailable: "The risk estimate is not available."
  risk_band_acceptable: "The risk estimate is in an acceptable band."
  risk_band_not_acceptable: "The risk estimate is outside the product's acceptable bands."
  risk_interval_clear: "The estimate's uncertainty is not close to a boundary between levels."
  borderline_risk_interval: "The estimate's uncertainty is close to a boundary between risk levels."
missing_fact:
  credit_score: "A recorded credit score."
  monthly_income: "Your monthly income (you can declare it in this conversation)."
  max_days_past_due: "The arrears information of your credit products."
  tenure_months: "Your time as a customer."
uncertainty:
  indicative_only: "This is an indicative guide based on synthetic rules and may change after a human review."
  borderline_estimate: "The risk estimate is close to a boundary, so the result is uncertain."
  missing_information: "Without the missing information we cannot give a guide."
  estimate_unavailable: "No risk estimate was available, so the result is uncertain."
review_path:
  submit_for_human_review: "If you like, we can record your application for review by a person from the credit team."
  request_human_contact: "If you like, a person from the credit team can review your case and contact you."
  provide_missing_information: "If you give us the missing information, we can give you a new guide; you can also ask to speak with a person."
