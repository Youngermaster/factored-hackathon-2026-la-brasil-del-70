name: la70-data

services:
  postgres:
    image: postgres:16.15-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    user: "70:70"
    restart: unless-stopped
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    env_file: /opt/la70-data/postgres.env
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/init-production:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/run/postgresql:uid=70,gid=70,mode=0775,size=8m
      - /tmp:uid=70,gid=70,size=64m
    shm_size: 128m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d bank_agent"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    deploy:
      resources:
        limits: {cpus: "1", memory: 1G}

volumes:
  pgdata:
