# OpenTelemetry Collector for the development `obs` profile (docs/operations/observability.md).
# The API exports OTLP over HTTP (4318) when OTEL_ENABLED=true; gRPC (4317) stays open for other clients.
# Traces go to Jaeger; metrics are exposed on 8889 for Prometheus, with the resource attributes (service.name,
# deployment.environment.name) copied onto every series so dashboards can filter by service.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch: {}

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true
    metric_expiration: 30m

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
