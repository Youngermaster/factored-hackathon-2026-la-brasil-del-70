# Grafana dashboard provider for the development `obs` profile: every JSON file next to this one loads read only.
apiVersion: 1

providers:
  - name: bank-agent
    folder: Bank agent
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
