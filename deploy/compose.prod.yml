# Production stack for one host (ADR 0019; guide: deploy/README.md). Run it through deploy/prod.sh, which passes
# the server env file (deploy/.env.production, never committed; template: deploy/.env.production.example).
#
#   web       Caddy: TLS, the static SPA with a strict CSP, the reverse proxy to the API; the only published service
#   api       uvicorn with WEB_CONCURRENCY workers, trusting X-Forwarded-For from the web container's address only
#   postgres  PostgreSQL 16 on an internal network, non-superuser owner (deploy/postgres/init-production)
#   migrate   one-shot: migrations as the owner, before the API starts
#   seed      one-shot (profile jobs): demo personas and customers from the committed sample
#   purge     the retention purge, once a day, as the owner
#   obs       profile: collector, Jaeger with Badger storage, Prometheus, Grafana (127.0.0.1, and read-only at
#             /grafana/ through Caddy when GRAFANA_ROUTE=on; ADR 0045)
#   ollama    profile: a self-hosted model on the private network (needs a VM with at least 16 GB of memory)
#   qdrant    profile rag: the vector index for knowledge retrieval (ADR 0047), on the internal network only
#
# Every service: no-new-privileges, every Linux capability dropped, CPU and memory limits, rotated logs, and a
# read-only root filesystem except where a note says why not.
#
# Secrets (ADR 0037) are files, never environment variables: deploy/secrets_stage.py stages them from Azure Key Vault
# (or, on other hosts, from the env file) under SECRETS_HOST_DIR, a tmpfs, owned by each container's user with mode
# 0400. Each service mounts only the files it needs at /run/secrets, and the settings read them through SECRETS_DIR.
# `docker compose config` and `docker inspect` therefore never show a secret value.

name: bank-agent-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  read_only: true
  logging: *logging

x-owner-environment: &owner-environment
  APP_ENV: production
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-bank_agent}
  POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER:-bank_owner}
  POSTGRES_APP_USER: ${POSTGRES_APP_USER:-bank_app}
  SECRETS_DIR: /run/secrets
  RETENTION_CONVERSATION_DAYS: ${RETENTION_CONVERSATION_DAYS:-7}
  RETENTION_SESSION_DAYS: ${RETENTION_SESSION_DAYS:-7}
  RETENTION_CREDIT_APPLICATION_DAYS: ${RETENTION_CREDIT_APPLICATION_DAYS:-30}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

# The owner jobs need the owner password and SESSION_SECRET (the seed derives identity keys from it), nothing else.
x-owner-secrets: &owner-secrets
  - source: app_postgres_admin_password
    target: POSTGRES_ADMIN_PASSWORD
  - source: app_session_secret
    target: SESSION_SECRET

x-job: &job
  image: bank-agent-job:${IMAGE_TAG:-local}
  build:
    context: ..
    dockerfile: services/api/Dockerfile
    target: job
  <<: *hardening
  environment: *owner-environment
  secrets: *owner-secrets
  tmpfs:
    - /tmp:size=64m
  networks: [backend]
  depends_on:
    postgres:
      condition: service_healthy
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: 768M

services:
  web:
    image: bank-agent-web:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
    <<: *hardening
    restart: unless-stopped
    # Lets the non-root Caddy bind 80 and 443 inside its own network namespace (no capability needed).
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS (the public host name) in the server env file}
      CADDY_TLS: ${CADDY_TLS:-acme}
      ACME_EMAIL: ${ACME_EMAIL:-}
      # on serves Grafana at /grafana/ (ADR 0045; needs the obs profile); off keeps it on the SSH tunnel only.
      GRAFANA_ROUTE: ${GRAFANA_ROUTE:-off}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp:size=16m
    networks:
      edge:
        ipv4_address: ${WEB_EDGE_ADDRESS:-172.28.10.10}
      # Caddy's only path to Grafana. No depends_on: grafana belongs to a profile that may be off.
      observability: {}
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  api:
    image: bank-agent-api:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: services/api/Dockerfile
      target: api
    <<: *hardening
    restart: unless-stopped
    environment:
      APP_ENV: production
      DEMO_MODE: ${DEMO_MODE:-false}
      ALLOW_PUBLIC_DEMO_MODE: ${ALLOW_PUBLIC_DEMO_MODE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WEB_CONCURRENCY: ${API_WORKERS:-2}
      FORWARDED_ALLOW_IPS: ${WEB_EDGE_ADDRESS:-172.28.10.10}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-bank_agent}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-bank_app}
      SECRETS_DIR: /run/secrets
      CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN (https://your-host) in the server env file}
      RATE_LIMIT_BACKEND: postgres
      RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-10}
      RATE_LIMIT_WRITE_PER_MINUTE: ${RATE_LIMIT_WRITE_PER_MINUTE:-30}
      RATE_LIMIT_READ_PER_MINUTE: ${RATE_LIMIT_READ_PER_MINUTE:-120}
      RATE_LIMIT_SESSION_AUTH_PER_MINUTE: ${RATE_LIMIT_SESSION_AUTH_PER_MINUTE:-10}
      RATE_LIMIT_SESSION_WRITE_PER_MINUTE: ${RATE_LIMIT_SESSION_WRITE_PER_MINUTE:-20}
      RATE_LIMIT_SESSION_READ_PER_MINUTE: ${RATE_LIMIT_SESSION_READ_PER_MINUTE:-60}
      # Empty: 5 new chats per customer per window, or 200 in the public demo (docs/security/demo-mode.md).
      CONVERSATION_CREATION_LIMIT: ${CONVERSATION_CREATION_LIMIT:-}
      CONVERSATION_CREATION_WINDOW_MINUTES: ${CONVERSATION_CREATION_WINDOW_MINUTES:-60}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      LLM_PRIMARY_MODEL: ${LLM_PRIMARY_MODEL:-}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_API_VERSION: ${LLM_API_VERSION:-}
      LLM_ALLOW_PRIVATE_HTTP_BASE: ${LLM_ALLOW_PRIVATE_HTTP_BASE:-false}
      LLM_DAILY_BUDGET_USD: ${LLM_DAILY_BUDGET_USD:-5}
      LLM_CONVERSATION_BUDGET_USD: ${LLM_CONVERSATION_BUDGET_USD:-0.50}
      LLM_SESSION_TOKEN_LIMIT: ${LLM_SESSION_TOKEN_LIMIT:-20000}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-20}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_BUDGET_LEDGER: postgres
      WORKFLOW_LLM_UNDERSTANDING: ${WORKFLOW_LLM_UNDERSTANDING:-true}
      WORKFLOW_LLM_PHRASING: ${WORKFLOW_LLM_PHRASING:-false}
      WORKFLOW_LLM_HANDOFF_SUMMARY: ${WORKFLOW_LLM_HANDOFF_SUMMARY:-false}
      WORKFLOW_MAX_ELIGIBILITY_ASSESSMENTS: ${WORKFLOW_MAX_ELIGIBILITY_ASSESSMENTS:-5}
      WORKFLOW_ELIGIBILITY_ASSESSMENT_WINDOW_MINUTES: ${WORKFLOW_ELIGIBILITY_ASSESSMENT_WINDOW_MINUTES:-60}
      # Open retrieval (ADR 0047): bm25 by default; qdrant or qdrant_hybrid need the rag profile and a built collection.
      RETRIEVAL_RETRIEVER: ${RETRIEVAL_RETRIEVER:-bm25}
      RETRIEVAL_QDRANT_URL: ${RETRIEVAL_QDRANT_URL:-}
      EVAL_SUMMARIES_PUBLIC: ${EVAL_SUMMARIES_PUBLIC:-false}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      # Metadata-only export of model calls to Langfuse (docs/operations/observability.md); needs LLM_PROVIDER=litellm,
      # an https base URL, and both Langfuse key files. The keys are never environment variables.
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
    # The application role, the session and CSRF keys, the model keys, and the Langfuse keys (empty files when no
    # hosted model or no Langfuse export is used); never the owner or superuser password.
    secrets:
      - source: app_postgres_app_password
        target: POSTGRES_APP_PASSWORD
      - source: app_session_secret
        target: SESSION_SECRET
      - source: app_csrf_secret
        target: CSRF_SECRET
      - source: app_llm_api_key_primary
        target: LLM_API_KEY_PRIMARY
      - source: app_llm_api_key_fallback
        target: LLM_API_KEY_FALLBACK
      - source: app_langfuse_public_key
        target: LANGFUSE_PUBLIC_KEY
      - source: app_langfuse_secret_key
        target: LANGFUSE_SECRET_KEY
    tmpfs:
      - /tmp:size=64m
    # host.docker.internal reaches a model served on the host itself (the local verification with Ollama).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [edge, backend]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M

  postgres:
    image: postgres:16.15-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    <<: *hardening
    restart: unless-stopped
    # The image's postgres user (uid 70) from the start, so the entrypoint needs no root, chown, or su.
    user: "70:70"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bank_agent}
      POSTGRES_USER: postgres
      # The image reads *_FILE for its own password; postgres/init-production/10-roles.sh reads the other two.
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_SUPERUSER_PASSWORD
      POSTGRES_OWNER_USER: ${POSTGRES_ADMIN_USER:-bank_owner}
      POSTGRES_OWNER_PASSWORD_FILE: /run/secrets/POSTGRES_ADMIN_PASSWORD
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-bank_app}
      POSTGRES_APP_PASSWORD_FILE: /run/secrets/POSTGRES_APP_PASSWORD
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=peer
    secrets:
      - source: postgres_superuser_password
        target: POSTGRES_SUPERUSER_PASSWORD
      - source: postgres_admin_password
        target: POSTGRES_ADMIN_PASSWORD
      - source: postgres_app_password
        target: POSTGRES_APP_PASSWORD
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-production:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/run/postgresql:uid=70,gid=70,mode=0775,size=8m
      - /tmp:uid=70,gid=70,size=64m
    shm_size: 128m
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  migrate:
    <<: *job
    command: ["bank-agent", "db", "upgrade"]
    restart: "no"

  seed:
    <<: *job
    profiles: [jobs]
    command: ["bank-data", "seed", "--source", "sample", "--customers", "${SEED_CUSTOMERS:-200}"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  purge:
    <<: *job
    command: ["bank-agent", "retention", "purge", "--every-hours", "${PURGE_EVERY_HOURS:-24}"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  # --- obs profile: traces and metrics, persisted; Grafana on 127.0.0.1 and, with GRAFANA_ROUTE=on, at /grafana/ ---
  otel-collector:
    profiles: [obs]
    image: otel/opentelemetry-collector:0.161.0@sha256:b6d2b9a85b1029d05b5ad913150c1f014eed4ae99be81a1813ca5ade4a191913
    <<: *hardening
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    # Its config and nothing else: host metrics come from the container's own /proc (ADR 0045), never from the Docker
    # socket or a host mount.
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    networks: [backend]
    depends_on: [jaeger]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M

  jaeger:
    profiles: [obs]
    image: jaegertracing/jaeger:2.21.0@sha256:3d0ac795ff98aa04d1be04311d2dac6c25b4bfc8322dc02e53bc5b170c5018c3
    <<: *hardening
    restart: unless-stopped
    command: ["--config=/etc/jaeger/config.yaml"]
    volumes:
      - ./observability/jaeger.yaml:/etc/jaeger/config.yaml:ro
      # The image declares /tmp as a world-writable volume, so this named volume is writable by its non-root user.
      - jaeger-data:/tmp
    ports:
      # The Jaeger UI, for the same SSH tunnel as Grafana (Jaeger 2.21 serves the v3 query API only, which Grafana's
      # Jaeger datasource does not read yet). It has no login: never open this port in the firewall.
      - "127.0.0.1:${JAEGER_PORT:-16686}:16686"
    networks: [backend, egress]
    deploy:
      resources:
        limits:
          # The local load test at 50 customers with every trace kept reached 470 MB (docs/operations/capacity.md).
          cpus: "0.5"
          memory: 768M

  prometheus:
    profiles: [obs]
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    <<: *hardening
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
      # Grafana viewers can send any PromQL through the datasource (ADR 0045): bound what one query may cost.
      - --query.timeout=30s
      - --query.max-samples=5000000
      - --query.max-concurrency=4
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks: [backend]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  grafana:
    profiles: [obs]
    image: grafana/grafana:13.2.2@sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0
    <<: *hardening
    restart: unless-stopped
    environment:
      # deploy/prod.sh refuses to start this profile without a staged GRAFANA_ADMIN_PASSWORD.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/GRAFANA_ADMIN_PASSWORD
      # Served by Caddy at <PUBLIC_ORIGIN>/grafana/ (ADR 0045), and through the tunnel at http://localhost:3000/grafana/.
      GF_SERVER_ROOT_URL: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN (https://your-host) in the server env file}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # true lets anyone view the provisioned dashboards without signing in (role Viewer: no editing, no Explore);
      # the admin login stays. Default false (ADR 0045, "anonymous viewer").
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS_VIEWER:-false}
      GF_AUTH_ANONYMOUS_ORG_NAME: Main Org.
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_ANONYMOUS_HIDE_VERSION: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_LOGIN_MAXIMUM_INACTIVE_LIFETIME_DURATION: 1h
      GF_AUTH_LOGIN_MAXIMUM_LIFETIME_DURATION: 12h
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_USERS_VIEWERS_CAN_EDIT: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "false"
      GF_SECURITY_CONTENT_SECURITY_POLICY: "true"
      # Grafana's own CSP (Caddy adds none on /grafana/): its default template without external hosts or websockets
      # (Live is off), and no framing. $$ is compose's escape: Grafana receives $NONCE.
      GF_SECURITY_CONTENT_SECURITY_POLICY_TEMPLATE: >-
        script-src 'self' 'unsafe-eval' 'unsafe-inline' 'strict-dynamic' $$NONCE; object-src 'none';
        font-src 'self'; style-src 'self' 'unsafe-inline' blob:; img-src 'self' data: blob:; base-uri 'self';
        connect-src 'self'; manifest-src 'self'; media-src 'none'; form-action 'self'; frame-ancestors 'none'
      GF_SNAPSHOTS_ENABLED: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_PUBLIC_DASHBOARDS_ENABLED: "false"
      GF_LIVE_MAX_CONNECTIONS: "0"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      # Nothing scrapes Grafana's own /metrics (unauthenticated by default); Caddy also answers 404 for it.
      GF_METRICS_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/bank-agent-service.json
      # No plugin downloads at startup: the bundled Prometheus datasource serves as shipped (an update would try to
      # replace it on the read-only root filesystem and unload it).
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PATHS_DATA: /var/lib/grafana
    secrets:
      - source: grafana_admin_password
        target: GRAFANA_ADMIN_PASSWORD
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    tmpfs:
      - /tmp:size=32m
    ports:
      # The SSH tunnel (deploy/README.md), the administrator's path when the Caddy route is off; never open 3000 in
      # the firewall.
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    # backend reaches Prometheus, egress carries the loopback port, observability is Caddy's path in.
    networks: [backend, egress, observability]
    depends_on: [prometheus]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          # 276 MB in use at 384 MB before the public route; viewers add sessions and query buffers.
          memory: 512M

  # --- ollama profile: a self-hosted model on the private network (not the default; about 5 GB of model) --------
  ollama:
    profiles: [ollama]
    image: ollama/ollama:0.35.0@sha256:2a6e883b917fc543389599dae79918f5cac9e1438890506982f44aa4f5625d01
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # Not read-only (its model store and runtime files live under /root/.ollama); the image runs as root, with every
    # capability dropped. It joins egress only so `ollama pull` can download the model.
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 24h
    volumes:
      - ollama-models:/root/.ollama
    networks: [backend, egress]
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 10G

  # The vector index for knowledge retrieval (ADR 0047). Derived data only: the collections hold the synthetic policy
  # clauses and are rebuilt by `bank-agent index qdrant`, so the volume is never backed up. Internal network only (no
  # egress, no published port); the unprivileged image runs as uid 1000 with a read-only root, and writes only its
  # storage and snapshot volumes and two tmpfs mounts. Started only with RAG=1 deploy/prod.sh up.
  qdrant:
    profiles: [rag]
    image: qdrant/qdrant:v1.19.2-unprivileged@sha256:efb96a9425a90d2d5a1a0a474156280df1892dcdf1af3e8515bd2589b1bfd88b
    <<: *hardening
    restart: unless-stopped
    user: "1000:1000"
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
      QDRANT__LOG_LEVEL: INFO
      # The "initialized" marker must land on a writable path when the root is read-only.
      QDRANT_INIT_FILE_PATH: /qdrant/init/.qdrant-initialized
    volumes:
      - qdrant-storage:/qdrant/storage
      - qdrant-snapshots:/qdrant/snapshots
    tmpfs:
      - /tmp:uid=1000,gid=1000,size=64m
      - /qdrant/init:uid=1000,gid=1000,size=1m
    networks: [backend]
    healthcheck:
      # The image has bash and grep but no curl or wget: an HTTP readiness request over bash's /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3 && grep -q 'all shards are ready' <&3
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

networks:
  edge:
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-172.28.10.0/24}
  backend:
    internal: true
  # A non-internal network: Grafana's loopback port and the ollama model download need it.
  egress: {}
  # Caddy to Grafana and nothing else: internal (no route out), joined by web and grafana only (ADR 0045).
  observability:
    internal: true

# Staged by deploy/secrets_stage.py; the directory is the consumer whose container user owns the files (app: uid 10001
# for the api and the jobs, postgres: uid 70, grafana: uid 472). The names match its SECRETS table.
secrets:
  app_postgres_admin_password:
    file: ${SECRETS_HOST_DIR:-/run/bank-agent/secrets}/app/POSTGRES_ADMIN_PASSWORD
  app_postgres_app_password:
    file: ${SECRETS_HOST_DIR:-/run/bank-agent/secrets}/app/POSTGRES_APP_PASSWORD
  app_session_secret:
    file: ${SECRETS_HOST_DIR:-/run/bank-agent/secrets}/app/SESSION_SECRET
  app_csrf_secret:
    file: ${SECRETS_HOST_DIR:-/run/bank-agent/secrets}/app/CSRF_SECRET
  app_llm_api_key_primary:
    file: ${SECRETS_HOST_DIR:-/run/bank-agent/secrets}/app/LLM_API_KEY_PRIMARY
  app_llm_api_key_fallback:
    file: ${SECRETS_HOST_DIR:-/run/bank-agent/secrets}/app/LLM_API_KEY_FALLBACK
