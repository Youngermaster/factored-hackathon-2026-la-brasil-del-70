[project]
name = "bank-ml"
version = "0.1.0"
description = "Learned components: intent router, transaction resolver, and risk estimator pipelines."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "bank-agent",
  "datasketch>=2.0.0,<3",
  "duckdb>=1.5.5,<2",
  "lightgbm>=4.7.0,<5",
  "mlflow-skinny>=3.16.1,<4",
  "numpy>=2.5,<3",
  "pyyaml>=6.0.3,<7",
  "rapidfuzz>=3.14.6,<4",
  "scikit-learn>=1.9.1,<2",
  "typer>=0.27.2,<1",
]

[project.scripts]
bank-ml = "bank_ml.cli:app"

[tool.uv.sources]
bank-agent = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.17,<0.13"]
build-backend = "uv_build"
