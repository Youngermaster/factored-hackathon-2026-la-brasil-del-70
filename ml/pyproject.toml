readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "typer>=0.27.2,<1",
]

[project.scripts]
bank-ml = "bank_ml.cli:app"

[build-system]
requires = ["uv_build>=0.11.17,<0.13"]
build-backend = "uv_build"
