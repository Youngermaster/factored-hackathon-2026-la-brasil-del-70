    es-MX: ["500 pesos", "1,250 pesos", "quinientos varos", "mil pesos", "300 varos", "2 mil pesitos", "$850"]
    es-CO: ["50 mil pesos", "50 lucas", "cien mil pesos", "20.000 pesos", "80 mil", "35 mil pesitos", "$120.000"]
