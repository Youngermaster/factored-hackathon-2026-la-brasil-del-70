# Regional slang: whole-word, case-insensitive replacements applied to the canonical text.
slang:
  es-MX:
    dinero: ["lana", "varo"]
    "por favor": ["porfa", "porfis"]
    ahora: ["ahorita"]
    tarjeta: ["plástico"]
    rápido: ["rapidito"]
    amigo: ["compa"]
  es-CO:
    dinero: ["plata"]
    "por favor": ["porfa", "hágame el favor"]
    rápido: ["rapidito"]
    ayúdeme: ["colabóreme"]
    ayudar: ["colaborar"]
  es-AR:
    dinero: ["guita", "plata"]
    "por favor": ["porfi"]
    trabajo: ["laburo"]
    "fin de semana": ["finde"]
    amigo: ["chabón"]
  pt-BR:
    dinheiro: ["grana"]
    você: ["vc"]
    "por favor": ["pfv"]
    estou: ["tô"]
    para: ["pra"]
    está: ["tá"]

# Speech-to-text fillers inserted at word boundaries (robustness set only).
fillers:
  es-MX: ["este", "o sea", "eh", "bueno", "pues"]
  es-CO: ["pues", "eh", "o sea", "mire", "bueno"]
  es-AR: ["che", "eh", "tipo", "bueno", "o sea"]
  pt-BR: ["tipo", "né", "então", "olha", "hum"]

# Speech-to-text confusions (seseo, yeismo, reductions), whole-word replacements (robustness set only).
homophones:
  es:
    hice: "ise"
    vez: "ves"
    hacer: "aser"
    haber: "a ver"
    llegó: "yegó"
    cancelé: "canselé"
    necesito: "nesesito"
    cobraron: "cobraro"
    hay: "ai"
    ya: "lla"
  pt:
    não: "num"
    está: "tá"
    você: "cê"
    para: "pra"
    mas: "mais"
    cartão: "cartaum"
    preciso: "presiso"
    fiz: "fis"

