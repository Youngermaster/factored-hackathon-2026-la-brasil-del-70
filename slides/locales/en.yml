workflows:
  title: Four workflows, one depth bar
  account_inquiry: account inquiry
  card_support: card support
  dispute: dispute
  credit: credit
  ofContacts: of contacts
  normal: normal
  ambiguous: ambiguous
  escalate: escalate
  # account_inquiry: read only
  a_n: START|IDENTIFY_PRODUCT|ANSWER_BALANCE
  a_nNote: Read only. Every balance states its as-of date.
  a_q: several accounts, which one?
  a_qNote: Transfers without a direction stay unclassified.
  a_e: document request
  a_eNote: A clause-backed abstention, or a handoff.
  # card_support: the first verified write
  c_n: IDENTIFY_CARD|CONFIRM_BLOCK|step-up code|EXECUTE_BLOCK|read-back
  c_nNote: Confirmation, a step-up code, a verified read-back.
  c_q: two cards, which one?
  c_qNote: It asks instead of guessing.
  c_e: unblock or replacement
  c_eNote: Identity and fraud checks need a person.
  # dispute: intake with a verified case
  d_n: LOCATE_TRANSACTION|CONFIRM_DISPUTE|CREATE_CASE|OFFER_CARD_BLOCK
  d_nNote: Reported only after the read-back finds it.
  d_q: two similar charges, which one?
  d_qNote: No complaint names its transaction, so it asks.
  d_e: above the limit, legal mention
  d_eNote: A handoff with verified facts and open questions.
  # credit: separation of risk and eligibility
  k_llm: language model
  k_llmSub: phrasing only
  k_wall: never sees the estimate or the credit profile
  k_risk: RiskEstimator
  k_riskSub: probability, band
  k_elg: EligibilityPolicy
  k_elgSub: synthetic ELG rules
  k_o1: indicatively_eligible
  k_o2: not_eligible
  k_o3: review_required
  k_o4: insufficient_data
  k_approved: approved
  k_note: No approved outcome exists, by design.
  # the bar every workflow meets
  bar_h: Same depth, every workflow
  bar1: clauses
  bar2: states
  bar3: verified
  bar4: handoff
  bar5: es + pt
  bar6: evaluation
  cite: docs/architecture/workflow-registry.md  |  docs/architecture/credit-separation.md

