  coreSub: rules and states
  ports: ports
  n_llm: LLM gateway
  n_llmSub: structured outputs
  n_ret: router and retrieval
  n_retSub: BM25, dense, hybrid
  n_ver: grounding verifier
  n_verSub: checks every draft
  n_db: PostgreSQL
  n_dbSub: row-level security
  n_data: data platform
  n_dataSub: DuckDB, dbt, contracts
  p1h: Policy kernel
  p1a: Rules are pure functions, registered by id.
  p1b: Clause text and parameters are data in policies/, in es, pt and en.
  p1c: Every Decision names the rule ids and clause versions it used.
  p2h: LLM gateway
  d1: redaction
  d2: budget guard
  d3: tracing
  d4: cost accounting
  d5: fallback model
  d6: circuit breaker
  d7: bounded retry
  d8: timeout
  prov1: fake
  prov2: cassette
  prov3: litellm
  p2c: Providers swap by settings. Any model error falls back to clarify, abstain or hand off.
  p3h: Grounding verifier
  draft: model draft
  gate: verifier
  send: send
  template: template
  p3c: Amounts, dates, clause ids and action claims must match records, clauses or verified results.
  p4h: Data platform
  s1: raw
  s2: bronze
  s3: silver
  s4: gold
  rowsIn: rows ingested
  rowsQ: rows quarantined, never dropped
