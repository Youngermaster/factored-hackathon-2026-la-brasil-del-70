appendix:
  eyebrow: appendix
  title: What profiling found in the data
  q1: customer branch references point to no branch
  q1h: flagged in silver and listed, never dropped
  q2: complaint product references name another customer's product
  q2h: so historical complaints are served without a product
  q3: transcripts have a null duration the dictionary forbids
  q3h: quarantined with a reason, never dropped silently
