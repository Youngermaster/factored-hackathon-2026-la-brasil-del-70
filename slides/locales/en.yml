# Every word the deck draws, one block per scene (scenes/<name>.ts reads its
# block with L('key')). Edit wording here; never in the drawing code.
#
# Rules (pnpm check:content enforces the first two):
#   - no em dashes; use a comma, a period, a colon or a connector word
#   - every key a scene draws must exist here, and every key here must be drawn
#   - numbers do not live here: they come from data/metrics.yml
#   - *asterisks* mark accent words in kinetic lines (the scene picks the colour)
#   - a plain value containing ": " must be quoted
#
# Two YAML traps: a plain scalar with ": " inside is a syntax error (quote it),
# and a value starting with * or & must be quoted.

