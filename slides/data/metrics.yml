# Every number the deck draws. Scenes read these with M('key'); they never
# hardcode a figure. Paths are relative to the repository root.
#
#   kind: offline      measured on historical or held-out data, not production
#         provisional  offline, but on labels still pending human review
#         projection   computed from stated, unverified assumptions
#         simulation   produced by a simulated workload
#         synthetic    a parameter of the team's synthetic policy pack
#   status: pending    the value does not exist yet; the deck shows "pending"
#
# `pnpm check:content` lists pending metrics. `pnpm check:content --strict`
# fails while any metric a slide uses is still pending: run it before the
# final export (pnpm export:final does).

