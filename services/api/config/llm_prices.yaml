# Language model prices, read by the cost accounting decorator and the budget guard.
#
# Prices are US dollars per million tokens, written as quoted strings so they parse as exact decimals.
# No price exists anywhere in code. Every hosted entry below has verified: false, including the Azure demo's primary
# model (gemini/gemini-3.1-flash-lite); the local Ollama entry costs nothing and is verified. Before relying on an
# entry, a person opens source_url, checks both prices for the exact model id, updates effective_date, and sets
# verified: true in the same commit.
#
# Unverified entries are charged at their price times unverified_price_multiplier, and a model missing from
# this table is charged at the highest input and output prices below times the multiplier, so the budget guard
# errs on the side of spending less.
#
# model_id is the id the gateway is configured with (LLM_PRIMARY_MODEL, LLM_FALLBACK_MODEL), in the LiteLLM
# provider/model form.

schema_version: 1
currency: USD
unverified_price_multiplier: "1.5"
models:
  - model_id: anthropic/claude-sonnet-5
    input_usd_per_million: "2.00"
    output_usd_per_million: "10.00"
    effective_date: 2026-06-24
    source_url: https://platform.claude.com/docs/en/about-claude/pricing
    verified: false
    notes: Candidate primary model. Standard first-party API rates; batch, caching, and partner platform prices differ.
  - model_id: anthropic/claude-haiku-4-5-20251001
    input_usd_per_million: "1.00"
    output_usd_per_million: "5.00"
    effective_date: 2026-06-24
    source_url: https://platform.claude.com/docs/en/about-claude/pricing
    verified: false
    notes: Candidate low-cost model for extraction prompts. Standard first-party API rates.
  - model_id: openai/gpt-5-mini
    input_usd_per_million: "0.25"
    output_usd_per_million: "2.00"
    effective_date: 2026-09-26
    source_url: https://openai.com/api/pricing/
    verified: false
    notes: Candidate fallback model from a second provider. Price taken from the provider's published list at launch; confirm it is still current.
  - model_id: gemini/gemini-3.1-flash-lite
    input_usd_per_million: "0.25"
    output_usd_per_million: "1.50"
    effective_date: 2026-10-02
    source_url: https://ai.google.dev/gemini-api/docs/pricing
    verified: false
    notes: Primary model of the Azure demo (Google AI Studio key). Paid tier standard text input price ($0.50 for audio input, unused here). gemini-2.5-flash is closed to new Google AI Studio users. The free tier has no per-token charge but Google may use its content to improve products, so a key without billing does not meet docs/security/data-use.md.
  - model_id: ollama/qwen2.5:7b-instruct
    input_usd_per_million: "0"
    output_usd_per_million: "0"
    effective_date: 2026-09-27
    source_url: https://ollama.com/library/qwen2.5
    verified: true
    notes: Local development model served by Ollama on the developer's machine, so there is no per-token charge. Opt-in only (LLM_PROVIDER=litellm with LLM_PRIMARY_MODEL=ollama/qwen2.5:7b-instruct); never a default and never a production provider.
  - model_id: azure/text-embedding-3-small
    input_usd_per_million: "0.022"
    output_usd_per_million: "0"
    effective_date: 2026-10-05
    source_url: https://prices.azure.com/api/retail/prices
    verified: false
    notes: Hosted embeddings for the Qdrant knowledge index (ADR 0047). Azure Retail Prices API, region swedencentral, checked 2026-10-05; only the Data Zone meter is published, so the price of the GlobalStandard deployment is not confirmed and the entry stays unverified (charged times the multiplier). Embeddings have no output tokens.
