# Model cards served by GET /v1/eval/models (evaluator only) and shown in the console's Supervision view.
#
# Every number below is copied by hand from a generated report or a model card in the repository; none is computed
# or rounded here. Each card names its source (the model card), its report (the generated evaluation), the commit
# and time the report was generated, the split, and the sample size. All of it is offline evidence on synthetic data
# (team-authored router seeds and retrieval judgments, organizer-provided synthetic records): it is not a production
# measurement. kind: provisional marks labels that still await human review; kind: offline marks labels made by
# construction or from the data. Intervals are 95% bootstraps as each report describes (seed groups for the router,
# customers for the resolver and the risk estimator); the retrieval report publishes no intervals.
#
# The promotions are the end-to-end comparisons of fixed against learned defaults from session 14b
# (docs/evaluation/results.md, "Decision: the learned router, resolver, and risk estimator defaults"): simulated
# customers and a grader on the dev split with the local model, so they are labeled simulated. Aliases
# (tfidf@champion) appear exactly as that section names them.
#
# Regenerate by hand whenever `make train`, `make eval-retrieval`, or a new defaults decision rewrites those
# reports; services/api/tests/unit/adapters/test_model_cards.py checks that this file validates, that
# every path exists, and that each default card names the baseline the settings serve by default.

