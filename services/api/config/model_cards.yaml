promotions:
  # docs/evaluation/results.md, "Decision: the learned router, resolver, and risk estimator defaults (dev evidence
  # only)". The rule changes a default only on a dev gain whose intervals do not overlap.
  - decision: router_and_resolver_defaults
    outcome: keep_baselines
    reason: overlapping_intervals
    workflows: [account_inquiry, card_support, dispute, credit]
    split: dev
    measurement: simulated
    language_model: "ollama/qwen2.5:7b-instruct"
    session: session_14b
    source: docs/evaluation/results.md
    rows:
      - run_id: dev-local-fixed
        git_sha: "813a6dc"
        models: ["router:keyword@1", "resolver:rules@1"]
        served: true
        cases: 112
        safe_automated_resolution: {count: 74, denominator: 112}
        unsafe_outcomes: {count: 0, denominator: 112}
        routing_correct: {count: 104, denominator: 112}
        escalation_unnecessary: {count: 10, denominator: 94}
        escalation_missed: {count: 0, denominator: 18}
      - run_id: dev-local-learned
