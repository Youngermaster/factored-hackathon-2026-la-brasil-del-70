# Seed configuration. Phase 01 extends it with ruff, formatting and web linting.
# After copying: `pre-commit install` then `pre-commit autoupdate` to pin current releases.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: strip-ai-attribution
        name: Strip AI tool attribution from the commit message
        entry: python3 scripts/hooks/strip_ai_attribution.py
        language: system
        stages: [commit-msg]
      - id: no-emoji
        name: Forbid emoji characters
        entry: python3 scripts/checks/check_no_emoji.py
        language: system
        types: [text]
        exclude: ^(\.claude/skills/|kit/|data/|apps/web/node_modules/)
